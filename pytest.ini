[pytest]
testpaths = tests
# tests/ has no __init__.py, so this puts the project root on sys.path and lets
# conftest.py be imported by name from the test modules
pythonpath = . tests
addopts = -q --strict-markers
filterwarnings =
    # torchvision warns about pretrained-weight enums even when weights=None
    ignore::UserWarning:torchvision.models._utils
